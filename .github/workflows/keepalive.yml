name: Supabase wachhalten
 
on:
  schedule:
    - cron: "17 6 * * 1,4"   # montags und donnerstags um 06:17 UTC
  workflow_dispatch:         # zusätzlich per Knopfdruck startbar
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anfragen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/skiitems?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Antwort: HTTP $code"
          test "$code" -lt 500
